# Fly.io config for one AIMarket hub — docs/run-on-a-platform.md.
#   fly launch --no-deploy --copy-config --name <your-app>
#   fly volumes create hub_data --size 1
#   fly secrets set AIMARKET_ADMIN_TOKEN=$(openssl rand -base64 32)
#   fly deploy
app = "your-aimarket-hub"

[build]
  dockerfile = "Dockerfile.standalone"

[env]
  AIMARKET_HUB_URL = "https://your-aimarket-hub.fly.dev"
  AIMARKET_HUB_NAME = "Your hub"

# Keys, database and settings: the hub's identity. Without the volume every deploy is a new hub.
[[mounts]]
  source = "hub_data"
  destination = "/app/data"

[http_service]
  internal_port = 9083
  force_https = true
  # A hub must answer crawls and admission probes at any hour; a stopped machine fails them.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  path = "/ai-market/v2/health"
  timeout = "5s"
