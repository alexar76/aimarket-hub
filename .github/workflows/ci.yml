name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hub (dev)
        run: pip install -e ".[dev]"

      - name: Pytest (core)
        run: pytest tests/ -q --tb=short -k "not cross_hub" --maxfail=5

      - name: Assert package version
        run: python3 -c "import importlib.metadata as m; assert m.version('aimarket-hub')=='0.1.0'"
