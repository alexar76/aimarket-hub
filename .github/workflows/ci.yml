name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AIMARKET_TEE_SOFTWARE_OK: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Fetch acex (capital_pricing dependency)
        # A pinned commit, not the moving HEAD of another repo (bump deliberately).
        run: |
          git clone --no-checkout https://github.com/alexar76/acex.git acex
          git -C acex checkout 5ab0d8100c649932cc1f3f01c7b612f347e02d7c  # alexar76/acex main, 2026-10-08

      - name: Install hub (dev + escrow)
        # escrow pulls eth-account; pipeline/x402 tests import it at collection time
        run: pip install -e ".[dev,escrow]"

      - name: Pytest + coverage badge
        run: bash scripts/ci_coverage_badge.sh -- tests/ -q --tb=short -k "not cross_hub" --maxfail=5 --cov=aimarket_hub

      - name: Assert package version matches pyproject
        run: |
          python3 - <<'PY'
          import importlib.metadata as m
          import tomllib
          from pathlib import Path
          expected = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          got = m.version("aimarket-hub")
          assert got == expected, f"{got!r} != {expected!r}"
          print(f"aimarket-hub {got}")
          PY
